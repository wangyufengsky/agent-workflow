<body data-page="start">
<main id="page" hidden><div class="page" style="max-width:1120px" id="view"></div></main>

<aside class="drawer" id="projDrawer" role="dialog" aria-modal="true" aria-labelledby="pdT" aria-hidden="true" tabindex="-1">
  <div class="drawer-head"><h2 id="pdT" class="grow">选择项目</h2><button class="icon-btn" aria-label="关闭" data-a="close-drawer" data-icon="x"></button></div>
  <div style="padding:14px 20px 4px"><div class="input-wrap"><span data-icon="search"></span><input class="input ctl" placeholder="搜索项目名称或路径" aria-label="搜索项目" data-filter="#pdList"></div></div>
  <div class="drawer-body dlist" id="pdList"></div>
</aside>
<aside class="drawer" id="flowDrawer" role="dialog" aria-modal="true" aria-labelledby="fdT" aria-hidden="true" tabindex="-1">
  <div class="drawer-head"><h2 id="fdT" class="grow">选择流程</h2><button class="icon-btn" aria-label="关闭" data-a="close-drawer" data-icon="x"></button></div>
  <div style="padding:14px 20px 4px"><div class="input-wrap"><span data-icon="search"></span><input class="input ctl" placeholder="搜索流程名称" aria-label="搜索流程" data-filter="#fdList"></div></div>
  <div class="drawer-body dlist" id="fdList"></div>
</aside>
<div id="dlgHost"></div>

<script src="assets/shell.js"></script>
