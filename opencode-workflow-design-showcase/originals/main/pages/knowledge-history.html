<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识对话记录 · opencode-workflow deepseek 风</title>
<link rel="stylesheet" href="../assets/ds.css">
<link rel="stylesheet" href="../assets/skins.css">
<style>
.wrapc{max-width:920px;margin:0 auto;padding:28px 32px 96px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0 6px}
.grp{font-size:12px;color:var(--muted);padding:18px 4px 8px;display:flex;gap:8px;align-items:center}
.conv{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;cursor:pointer;transition:background var(--t-fast)}
.conv:hover{background:var(--fill-2)}
.conv:hover .acts{opacity:1}
.conv .q{font-size:14.5px;color:var(--ink);line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.conv .a{font-size:13px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.conv .meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.conv .acts{opacity:0;transition:opacity var(--t-fast);display:flex;gap:2px}
.conv.need{background:var(--warn-fill);box-shadow:inset 2px 0 0 var(--warn)}
.ico{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--fill-3);color:var(--sub)}
.need .ico{background:var(--warn-fill);color:var(--warn)}
mark{background:rgba(169,188,255,.22);color:var(--ink);border-radius:3px;padding:0 1px}
</style>
<link rel="stylesheet" href="../../../showcase/bridge.css">
<script src="../../../showcase/icons.js"></script>
<script src="../../../showcase/navigation.js"></script>
<script defer src="../../../showcase/catalog.js"></script>
<script defer src="../../../showcase/bridge.js"></script>
</head>
<body data-page="knowledge">
<main id="page" hidden><div class="wrapc">
  <div class="row" style="align-items:flex-end"><div class="grow"><div class="eyebrow">知识库</div><h1 class="title" style="margin-top:6px">对话记录</h1><p class="lede" style="margin-top:6px">回到任何一次提问，继续追问或查看当时的引用。</p></div>
    <a class="btn primary" href="knowledge.html"><span data-icon="plus" data-icon-size="sm"></span>新建对话</a></div>
  <div class="tools">
    <div class="input-wrap" style="flex:1;min-width:240px"><span data-icon="search"></span><input class="input ctl" id="q" placeholder="搜索问题或回答内容" aria-label="搜索对话" oninput="render()"></div>
    <select class="select ctl" aria-label="项目" style="width:auto" onchange="render()"><option>全部项目</option><option>OpenCode Loopper</option><option>R05 设计系统</option></select>
    <div class="seg" role="tablist" aria-label="状态" id="seg"></div>
  </div>
  <div id="list"></div>
</div></main>
<script src="../assets/shell.js"></script>
<script>
const I=DS.icon, esc=DS.esc, S=DS.state||'list';
const DATA=[
 {g:'今天',q:'这个项目如何处理任务执行、资料读取和错误恢复？',a:'任务执行与资料读取，分别由服务端持有边界……',p:'OpenCode Loopper',m:'Claude Sonnet 4.6',s:'done',t:'14:32',c:3},
 {g:'今天',q:'哪些操作需要单独的读取许可？',a:'研究员需要你确认：是否允许读取 docs/deliveries 下的交接文档？',p:'OpenCode Loopper',m:'Claude Sonnet 4.6',s:'need',t:'13:05',c:0},
 {g:'今天',q:'对比一下 v1 和 v2 的任务恢复逻辑差异',a:'正在读取原文 · 2 / 5 份',p:'OpenCode Loopper',m:'Claude Opus 4.6',s:'run',t:'12:48',c:0},
 {g:'昨天',q:'设计系统里状态色是如何定义的？',a:'状态色分为运行、等待、卡住、失败、完成五类……',p:'R05 设计系统',m:'Claude Sonnet 4.6',s:'done',t:'18:20',c:5},
 {g:'昨天',q:'为什么 UNKNOWN 结果不能直接重试？',a:'回答在生成中途停止，已写出的内容保留。',p:'OpenCode Loopper',m:'Claude Sonnet 4.6',s:'stopped',t:'16:02',c:1},
 {g:'更早',q:'数据库里 runs 表和 attempts 表是什么关系？',a:'连接在研究阶段中断，可以从断点继续。',p:'OpenCode Loopper',m:'Claude Sonnet 4.6',s:'broken',t:'10月6日',c:0},
 {g:'更早',q:'导出 PPT 时字体是如何处理的？',a:'导出时会嵌入演示中实际用到的字体子集……',p:'R05 设计系统',m:'Claude Sonnet 4.6',s:'done',t:'10月2日',c:2},
];
const ST={done:['已完成','st-ok'],need:['需要你回答','st-fail'],run:['研究中','st-accent'],stopped:['已停止','st-idle'],broken:['连接中断','st-danger']};
let filter = S==='need'?'need':'all';
function seg(){ DS.$('#seg').innerHTML=[['all','全部'],['need','需要回答'],['run','进行中'],['done','已完成']].map(([k,l])=>`<button role="tab" aria-selected="${filter===k}" class="${filter===k?'on':''}" onclick="filter='${k}';seg();render()">${l}${k==='need'?' <span class="num" style="color:var(--warn)">1</span>':''}</button>`).join(''); }
function hl(s,q){ s=esc(s); if(!q) return s; const i=s.indexOf(esc(q)); return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+esc(q).length)+'</mark>'+s.slice(i+esc(q).length); }
function render(){
  const L=DS.$('#list');
  if (S==='loading'){ L.innerHTML=[1,2,3,4].map(()=>`<div class="conv"><span class="skel" style="width:32px;height:32px;border-radius:10px"></span><div class="grow col" style="gap:8px"><span class="skel" style="height:14px;width:60%"></span><span class="skel" style="height:12px;width:40%"></span></div></div>`).join(''); return; }
  if (S==='empty'){ L.innerHTML=`<div class="empty" style="margin-top:40px"><span data-icon="book"></span><h3>还没有对话</h3><p>提出第一个问题后，记录会保存在这里。</p><a class="btn primary" href="knowledge.html">去提问</a></div>`; DS.icons(L); return; }
  if (S==='error'){ L.innerHTML=`<div class="banner danger" style="margin-top:16px">${I('alert','sm')}<div><b>记录加载失败</b><div class="hint">网络或服务暂时不可用，已有对话不受影响。</div></div><div class="actions"><button class="btn secondary sm" onclick="location.search=''">重试</button></div></div>`; return; }
  const q=DS.$('#q').value.trim();
  let rows=DATA.filter(d=>filter==='all'||d.s===filter||(filter==='run'&&d.s==='broken')).filter(d=>!q||d.q.includes(q)||d.a.includes(q));
  if (!rows.length){ L.innerHTML=`<div class="empty" style="margin-top:24px"><h3>没有匹配的对话</h3><p>换个关键词，或清除筛选。</p><button class="btn secondary" onclick="DS.$('#q').value='';filter='all';seg();render()">清除筛选</button></div>`; return; }
  const groups=[...new Set(rows.map(r=>r.g))];
  L.innerHTML=groups.map(g=>`<div class="grp">${g}<span class="num">${rows.filter(r=>r.g===g).length}</span></div>`+rows.filter(r=>r.g===g).map(d=>{const [l,c]=ST[d.s];return `
    <div class="conv ${d.s==='need'?'need':''}" tabindex="0" role="link" onclick="SC.href ='knowledge.html?state=${d.s==='run'?'run':d.s==='stopped'?'stopped':'done'}'">
      <span class="ico">${d.s==='need'?I('help','sm'):d.s==='run'?'<span class="spin" style="width:14px;height:14px;color:var(--accent)"></span>':d.s==='broken'?I('alert','sm'):I('book','sm')}</span>
      <div class="grow" style="min-width:0"><div class="q">${hl(d.q,q)}</div><div class="a">${hl(d.a,q)}</div>
        <div class="meta"><span class="badge ${c}">${l}</span><span>${d.p}</span><span>·</span><span>${d.m}</span>${d.c?`<span>·</span><span>${d.c} 处引用</span>`:''}</div></div>
      <div class="col" style="align-items:flex-end;gap:8px"><span class="hint num">${d.t}</span>
        ${d.s==='need'?`<button class="btn primary sm" onclick="event.stopPropagation();SC.href ='inbox.html'">去回答</button>`:d.s==='broken'?`<button class="btn secondary sm" onclick="event.stopPropagation();DS.toast('已从断点继续','info')">继续</button>`:`<span class="acts"><button class="icon-btn" aria-label="更多" onclick="event.stopPropagation();DS.menu(this,[{label:'重命名',icon:'edit'},{label:'归档',icon:'archive',run:()=>DS.toast('已归档 · 可在“已归档”中找回')}])">${I('more')}</button></span>`}</div>
    </div>`}).join('')).join('');
}
DS.mount({header:`<h1><a href="knowledge.html" style="color:var(--sub)">知识库</a><span style="color:var(--faint);margin:0 8px">/</span>对话记录</h1>`, state:S, states:[{id:'list',label:'列表'},{id:'need',label:'筛选：需要回答'},{id:'loading',label:'加载中'},{id:'empty',label:'空'},{id:'error',label:'加载失败'}]});
seg(); render();
</script>
</body>
</html>
