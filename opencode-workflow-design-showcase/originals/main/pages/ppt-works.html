<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT 作品 · opencode-workflow deepseek 风</title>
<link rel="stylesheet" href="../assets/ds.css">
<link rel="stylesheet" href="../assets/skins.css">
<style>
.pw{max-width:1180px;margin:0 auto;padding:28px 32px 96px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.wk{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:16px;border:1px solid transparent;cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast);position:relative}
.wk:hover{background:var(--fill-2);border-color:var(--line)}
.wk:hover .acts{opacity:1}
.thumb{aspect-ratio:16/9;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,#16181f,#0e0f12);position:relative;overflow:hidden}
.thumb i{position:absolute;left:10%;height:6%;border-radius:2px;background:var(--fill-5)}
.thumb .pg{position:absolute;right:8px;bottom:8px;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.6);color:var(--ink-2)}
.acts{position:absolute;top:16px;right:16px;opacity:0;transition:opacity var(--t-fast)}
.acts .icon-btn{background:rgba(10,10,10,.75);backdrop-filter:blur(6px)}
.stage{display:flex;gap:3px;align-items:center}
.stage b{width:16px;height:3px;border-radius:2px;background:var(--line-2)}
.stage b.on{background:var(--accent)}
.stage b.ex{background:var(--ok)}
.list .wk{flex-direction:row;align-items:center;gap:16px}
.list .grid{grid-template-columns:1fr;gap:4px}
.list .thumb{width:132px;flex:none}
.list .acts{position:static;opacity:1}
</style>
<link rel="stylesheet" href="../../../showcase/bridge.css">
<script src="../../../showcase/icons.js"></script>
<script src="../../../showcase/navigation.js"></script>
<script defer src="../../../showcase/catalog.js"></script>
<script defer src="../../../showcase/bridge.js"></script>
</head>
<body data-page="ppt">
<main id="page" hidden><div class="pw" id="root">
  <div class="row" style="align-items:flex-end"><div class="grow"><div class="eyebrow">PPT 制作</div><h1 class="title" style="margin-top:6px">全部作品</h1></div><a class="btn primary" href="ppt.html"><span data-icon="plus" data-icon-size="sm"></span>新建演示</a></div>
  <div class="tools">
    <div class="input-wrap" style="width:220px"><span data-icon="search"></span><input class="input ctl" id="q" placeholder="搜索作品" aria-label="搜索作品" oninput="render()"></div>
    <select class="select ctl" id="pj" aria-label="项目" style="width:auto" onchange="render()"><option value="">全部项目</option><option>OpenCode Loopper</option><option>R05 设计系统</option></select>
    <div class="seg" role="tablist" aria-label="阶段" id="seg"></div>
    <span class="grow"></span>
    <label class="row hint" style="gap:8px;cursor:pointer"><button class="switch" role="switch" id="arc" aria-checked="false" aria-label="显示已归档" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true');render()"></button>显示已归档</label>
    <div class="seg" aria-label="视图"><button aria-pressed="true" id="vg" onclick="view('g')" aria-label="网格"><span data-icon="template" data-icon-size="sm"></span></button><button aria-pressed="false" id="vl" onclick="view('l')" aria-label="列表"><span data-icon="list" data-icon-size="sm"></span></button></div>
  </div>
  <div id="list"></div>
</div></main>
<script src="../assets/shell.js"></script>
<script>
const I=DS.icon, esc=DS.esc, S=DS.state||'list';
const STAGES=['讨论需求','设计方案','制作检查','已导出'];
const W=[
 {t:'项目入门与架构说明',p:'OpenCode Loopper',s:2,n:6,u:'2 小时前',busy:'第 4 页制作中'},
 {t:'Q3 交付复盘',p:'OpenCode Loopper',s:1,n:0,u:'昨天',wait:'方案待你确认'},
 {t:'恢复机制方案评审',p:'OpenCode Loopper',s:0,n:0,u:'10月6日',wait:'助手有 2 个问题'},
 {t:'设计系统介绍',p:'R05 设计系统',s:3,n:12,u:'10月2日'},
 {t:'组件规范速览',p:'R05 设计系统',s:3,n:8,u:'9月28日'},
 {t:'数据平台迁移计划',p:'OpenCode Loopper',s:2,n:10,u:'9月21日',warn:'2 页检查未通过'},
 {t:'旧版首页提案',p:'R05 设计系统',s:3,n:5,u:'8月30日',arc:true},
];
let f=-1, v='g';
function seg(){ DS.$('#seg').innerHTML=[[-1,'全部'],...STAGES.map((s,i)=>[i,s])].map(([k,l])=>`<button role="tab" aria-selected="${f===k}" onclick="f=${k};seg();render()">${l}</button>`).join(''); }
function view(x){ v=x; DS.$('#vg').setAttribute('aria-pressed',x==='g'); DS.$('#vl').setAttribute('aria-pressed',x==='l'); render(); }
function thumb(seed,n){ return `<div class="thumb">${n?[18,32,44,56].map((y,i)=>`<i style="top:${y}%;width:${[42,64,52,30][(i+seed)%4]}%;${i?'':'height:9%;background:var(--ink-2)'}"></i>`).join('')+`<span style="position:absolute;right:8%;bottom:16%;width:26%;height:36%;border-radius:4px;background:rgba(77,107,254,${.16+(seed%4)*.06})"></span><span class="pg">${n} 页</span>`:`<span style="position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px">尚未生成页面</span>`}</div>`; }
function render(){
  const L=DS.$('#list'); DS.$('#root').classList.toggle('list', v==='l');
  if (S==='loading'){ L.innerHTML=`<div class="grid">${[1,2,3,4,5,6].map(()=>`<div class="wk"><span class="skel" style="aspect-ratio:16/9;border-radius:10px"></span><span class="skel" style="height:14px;width:70%"></span><span class="skel" style="height:12px;width:40%"></span></div>`).join('')}</div>`; return; }
  if (S==='empty'){ L.innerHTML=`<div class="empty" style="margin-top:30px"><span data-icon="slides"></span><h3>还没有演示</h3><p>从一个想法开始，助手会先和你讨论需求。</p><a class="btn primary" href="ppt.html">新建演示</a></div>`; DS.icons(L); return; }
  const q=DS.$('#q').value.trim(), pj=DS.$('#pj').value, arc=DS.$('#arc').getAttribute('aria-checked')==='true';
  const rows=W.map((w,i)=>({...w,i})).filter(w=>(f<0||w.s===f)&&(!pj||w.p===pj)&&(!q||w.t.includes(q))&&(arc||!w.arc));
  if (!rows.length){ L.innerHTML=`<div class="empty"><h3>没有符合条件的作品</h3><button class="btn secondary" onclick="DS.$('#q').value='';DS.$('#pj').value='';f=-1;seg();render()">清除筛选</button></div>`; return; }
  L.innerHTML=`<div class="grid">${rows.map(w=>`<div class="wk" tabindex="0" role="link" onclick="SC.href ='ppt-studio.html'" style="${w.arc?'opacity:.6':''}">
    ${thumb(w.i,w.n)}
    <div class="grow" style="min-width:0;display:flex;flex-direction:column;gap:6px">
      <div class="row" style="gap:8px"><span class="ellipsis grow" style="font-size:14px;font-weight:500">${esc(w.t)}</span>${w.arc?'<span class="badge">已归档</span>':''}</div>
      <div class="row" style="gap:8px"><span class="stage">${STAGES.map((_,k)=>`<b class="${k<w.s||w.s===3?(w.s===3?'ex':'on'):k===w.s?'on':''}"></b>`).join('')}</span><span class="hint">${STAGES[w.s]}</span></div>
      <div class="hint ellipsis">${w.p} · 更新于 ${w.u}</div>
      ${w.busy?`<div class="row" style="gap:6px;font-size:12.5px;color:var(--run)"><span class="dot pulse"></span>${w.busy}</div>`:w.wait?`<div class="row" style="gap:6px;font-size:12.5px;color:var(--accent)">${I('help','sm')}${w.wait}</div>`:w.warn?`<div class="row" style="gap:6px;font-size:12.5px;color:var(--warn)">${I('alert','sm')}${w.warn}</div>`:''}
    </div>
    <div class="acts"><button class="icon-btn" aria-label="更多操作" onclick="event.stopPropagation();DS.menu(this,[{label:'打开',icon:'external'},{label:'复制为新演示',icon:'copy',run:()=>DS.toast('已复制，正在打开副本')},{label:'导出',icon:'download'},'-',{label:'${w.arc?'取消归档':'归档'}',icon:'archive',run:()=>DS.toast('${w.arc?'已取消归档':'已归档'}')}])">${I('more')}</button></div>
  </div>`).join('')}</div>`;
}
DS.mount({header:`<h1><a href="ppt.html" style="color:var(--sub)">PPT 制作</a><span style="color:var(--faint);margin:0 8px">/</span>全部作品</h1>`, state:S, states:[{id:'list',label:'作品'},{id:'loading',label:'加载中'},{id:'empty',label:'空'}]});
seg(); render();
</script>
</body>
</html>
