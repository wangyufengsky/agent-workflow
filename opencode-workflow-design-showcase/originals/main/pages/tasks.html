<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'">

<style>
.attn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
@media (max-width:1100px){.attn{grid-template-columns:1fr}}
.attn a{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.attn .tile{width:32px;height:32px;border-radius:9px}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 150px 92px 32px;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;transition:background var(--t-fast);cursor:pointer}
.trow:hover{background:var(--fill-2)}
.trow+.trow{box-shadow:inset 0 1px 0 var(--line)}
.trow:hover+.trow,.trow:hover{box-shadow:none}
.thead{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 150px 92px 32px;gap:16px;padding:10px 16px;font-size:12px;color:var(--muted);box-shadow:inset 0 -1px 0 var(--line)}
.tname{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;min-width:0}
.tsub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.need{font-size:12.5px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bars{display:flex;gap:3px;align-items:center}
.bars i{flex:1;height:5px;border-radius:3px;background:var(--fill-4)}
.bars i.done{background:var(--done)}.bars i.run{background:var(--run)}.bars i.stall{background:var(--stall)}.bars i.fail{background:var(--warn)}.bars i.wait{background:var(--wait)}.bars i.unk{background:transparent;border:1px dashed var(--unknown-line)}
.bars-cap{font-size:11.5px;color:var(--muted);margin-top:5px}
.time{font-size:12.5px;color:var(--muted);text-align:right}
.group-h{display:flex;align-items:center;gap:8px;padding:16px 16px 6px;font-size:12.5px;color:var(--sub)}
@media (max-width:1100px){.trow,.thead{grid-template-columns:minmax(0,1fr) 140px 32px}.trow>.c-need,.thead>.c-need,.trow>.time,.thead>.time{display:none}}
</style>

];
const ST = {prep:['待准备工作区','st-wait','folder'], paused:['已暂停','st-idle','pause'], plan:['规划中','st-accent','sparkle'], plneed:['需要处理','st-wait','help'], plreview:['等待审阅','st-wait','eye'], plstop:['正在停止','st-idle','stop'], plunk:['待核对','st-unknown','help'], ploverview:['规划总览','st-unknown','layers'], run:['执行中','st-run','play'], stall:['停滞','st-stall','alert'], fail:['失败','st-fail','x'], wait:['待确认计划','st-wait','clock'], done:['已完成','st-done','check'], unknown:['状态未核对','st-unknown','help'], stopped:['已终止','st-idle','stop']};
let f='all', q='', proj='all', grouped=false;
const groupOf = t => ['stall','fail','wait','unknown','plneed','plreview','plunk','ploverview','prep'].includes(t.st)?'attention':['run','plan','plstop','paused'].includes(t.st)?'active':'closed';
function row(t){
  const s=ST[t.st];
  return `<div class="trow" role="link" tabindex="0" onclick="openTask('${t.id}')" onkeydown="if(event.key==='Enter')openTask('${t.id}')" aria-label="${esc(t.t)}，${s[0]}">
    <div style="min-width:0"><div class="row" style="gap:8px"><span class="tname">${esc(t.t)}</span>${t.type!=='需求任务'?`<span class="badge outline" style="height:20px">${t.type}</span>`:''}</div>
      <div class="tsub">${I('folder','sm')}<span>${esc(t.p)}</span></div></div>
    <div class="c-need">${t.need?`<div class="need">${esc(t.need)}</div>`:`<span class="hint">—</span>`}</div>
    <div>${t.steps.length?`<div class="bars" aria-hidden="true">${t.steps.map(x=>`<i class="${x==='unk'?'unk':x}"></i>`).join('')}</div>`:''}<div class="bars-cap">${t.cap}</div></div>
    <div class="time"><span class="badge ${s[1]}" style="margin-bottom:4px">${I(s[2],'sm')}${s[0]}</span><br>${t.at}</div>
    <button class="icon-btn" aria-label="更多：${esc(t.t)}" onclick="event.stopPropagation();DS.menu(this,[{label:'打开执行画布',icon:'arrowRight',run(){openTask('${t.id}')}},{label:'复制任务链接',icon:'link',run(){DS.toast('已复制链接','info')}}${['done','stopped'].includes(t.st)?`,'-',{label:'归档',icon:'archive',run(){DS.toast('已归档','info')}}`:''}])">${I('more')}</button>
  </div>`;
}
function openTask(id){ const t=TASKS.find(x=>x.id===id); if(t.showcaseRoute){SC.go(t.showcaseRoute);return;} /* v4：没有身份的行不进旧画布 */ DS.toast('该行缺少任务身份（原型数据）','warn'); }
function render(keep){
  const pos=keep&&document.activeElement.selectionStart;
  const counts={all:TASKS.length, attention:TASKS.filter(t=>groupOf(t)==='attention').length, active:TASKS.filter(t=>groupOf(t)==='active').length, closed:TASKS.filter(t=>groupOf(t)==='closed').length};
  const rows=TASKS.filter(t=>(f==='all'||groupOf(t)===f)&&(proj==='all'||t.p===proj)&&(!q||(t.t+t.p+t.need).includes(q)));
  let body;
  if (S0==='loading') body=`<div style="padding:8px">${[0,1,2,3,4].map(()=>`<div class="row" style="padding:16px"><div class="col grow"><div class="skel" style="height:13px;width:45%"></div><div class="skel" style="height:11px;width:25%"></div></div><div class="skel" style="height:6px;width:140px"></div><div class="skel" style="height:20px;width:70px;border-radius:99px"></div></div>`).join('')}</div>`;
  else if (S0==='error') body=`<div style="padding:16px"><div class="banner danger">${I('alert')}<div><b>任务列表读取失败</b><br>本地服务没有响应。筛选条件已保留。</div><div class="actions"><button class="btn secondary sm" onclick="DS.setState('ready')">${I('refresh','sm')}重试</button></div></div></div>`;
  else if (S0==='empty') body=`<div class="empty"><span class="tile">${I('list','lg')}</span><h3>还没有任务</h3><p>从一个目标开始：选项目、写目标、选流程，先得到一份需求草稿。</p><a class="btn primary" href="start.html" style="margin-top:6px">${I('plus','sm')}开始任务</a></div>`;
  else if (!rows.length) body=`<div class="empty"><span class="tile">${I('search','lg')}</span><h3>没有符合条件的任务</h3><p>换个关键词或清除筛选。</p><button class="btn secondary sm" onclick="f='all';q='';proj='all';render()">清除筛选</button></div>`;
  else if (grouped) body = [...new Set(rows.map(t=>t.p))].map(p=>`<div class="group-h">${I('folder','sm')}${esc(p)}<span class="muted num">${rows.filter(t=>t.p===p).length}</span></div>${rows.filter(t=>t.p===p).map(row).join('')}`).join('');
  else body = rows.map(row).join('');
  DS.$('#view').innerHTML = `
  <div class="page-head"><div class="grow"><h2 class="title">任务</h2><p class="lede">每个任务都在执行画布里：哪一步在跑、哪一步卡住、下一步做什么。</p></div></div>
  ${S0==='ready'||S0==='grouped'?`<div class="attn" aria-label="需要你处理">${TASKS.filter(t=>groupOf(t)==='attention'&&!['unknown','plunk','ploverview'].includes(t.st)).slice(0,6).map(t=>`<a class="card hoverable" href="#" onclick="event.preventDefault();openTask('${t.id}')"><span class="tile" style="color:var(--${t.st==='stall'?'stall':t.st==='fail'?'warn':'wait'})">${I(ST[t.st][2])}</span><span class="grow" style="min-width:0"><div style="font-size:13.5px;font-weight:500" class="ellipsis">${esc(t.t)}</div><div class="hint" style="margin-top:2px">${esc(t.need)}</div></span></a>`).join('')}</div>`:''}
  <div class="row wrap" style="gap:10px;margin-bottom:14px">
    <div class="input-wrap" style="width:260px">${I('search')}<input class="input ctl" placeholder="搜索任务、项目或原因" value="${esc(q)}" oninput="q=this.value.trim();render(true)" aria-label="搜索任务"></div>
    <div class="seg" role="group" aria-label="状态">${[['all','全部'],['attention','需要处理'],['active','进行中'],['closed','已结束']].map(([k,l])=>`<button aria-pressed="${f===k}" onclick="f='${k}';render()">${l}<span class="num muted">${counts[k]}</span></button>`).join('')}</div>
    <select class="select ctl" style="width:auto" aria-label="项目" onchange="proj=this.value;render()"><option value="all">全部项目</option>${[...new Set(TASKS.map(t=>t.p))].map(p=>`<option ${proj===p?'selected':''}>${p}</option>`).join('')}</select>
    <span class="grow"></span>
    <label class="check" style="align-items:center;font-size:13px;color:var(--sub)"><input type="checkbox" ${grouped?'checked':''} onchange="grouped=this.checked;render()">按项目分组</label>
  </div>
  <section class="card"><div class="thead"><span>任务</span><span class="c-need">需要处理</span><span>步骤</span><span class="time">状态</span><span></span></div><div style="padding:4px 6px 6px">${body}</div>
  ${!['loading','error','empty'].includes(S0)&&rows.length?`<div class="row" style="padding:10px 16px 14px;box-shadow:inset 0 1px 0 var(--line)"><span class="hint grow">已加载 ${rows.length} 个 · 最近更新优先</span><button class="btn ghost sm">加载更多</button><a class="btn ghost sm" href="#" onclick="event.preventDefault();DS.toast('已切换到归档任务','info')">${I('archive','sm')}已归档</a></div>`:''}</section>`;
  if (keep){ const el=DS.$('input[aria-label="搜索任务"]'); el.focus(); el.setSelectionRange(pos,pos); }
}
if (S0==='grouped') grouped=true;
DS.mount({ header:`<h1>${I('list')}任务列表</h1><span class="spacer"></span><button class="icon-btn" aria-label="刷新" onclick="DS.toast('已刷新','info')">${I('refresh')}</button><a class="btn primary sm" href="start.html">${I('plus','sm')}开始任务</a>`, state:S0, states:[
  {id:'ready',label:'日常'},{id:'grouped',label:'按项目分组'},{id:'loading',label:'加载中'},{id:'error',label:'读取失败'},{id:'empty',label:'没有任务'}] });
render();
</script>
</body>
