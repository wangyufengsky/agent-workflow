name: Setup
description: pnpm, Node 24 and the workspace's dependencies; the pnpm store is cached under the lockfile's hash.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
