# Three-platform CI (docs/17 §4.1, D76, D81, D82). Runs only when started by hand (Actions → CI → Run workflow, or
# `gh workflow run ci.yml --ref <branch>`): before a release, or when a change needs checking on Windows or Linux.
# Day-to-day acceptance is the full local run on macOS. Tests that need the real opencode and a model (test:oc,
# test:live, J10) are not run here: they stay on the developer's machine.
#
# Every platform runs the same tests as `pnpm verify`, `pnpm e2e` and `pnpm e2e:smoke`. A private repository's Linux
# and Windows runners have 2 vCPUs, so the tests run one at a time there: on those two platforms the suites are split
# into jobs that run at once (int and browser E2E in shards). macOS stays one job: it finishes in about 3 minutes
# and its minutes cost ten times as much.
#
# Inside a job, later steps run after a failed one, so a round shows every problem of that job; a failed step fails
# its job and with it the run. A failed job is rerun on its own with "Re-run failed jobs".
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pnpm check
        run: pnpm check
      - name: pnpm test
        if: ${{ !cancelled() }}
        run: pnpm test

  int:
    name: test:int (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: test:int
        if: runner.os == 'Linux'
        run: |
          docker pull mysql:8.4
          docker pull postgres:17.6
          docker pull opengauss/opengauss-server:7.0.0-RC3.B025
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          pnpm test:int --shard=${{ matrix.shard }}/2
      # The database tests need Linux containers (docs/24 §7): the Windows runner's Docker runs only Windows containers
      # and the macOS runner has no Docker. They only talk to the servers over TCP, so the ubuntu run covers them.
      - name: test:int (without the database tests, see above)
        if: runner.os != 'Linux'
        shell: bash
        # Explicit file list: vitest's --exclude flag does not reach the files of a configured project.
        run: pnpm test:int --shard=${{ matrix.shard }}/2 $(git ls-files '*.int.test.ts' | grep -v '/databases\..*int.test.ts$')

  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Only the headless shell: browser E2E runs headless. System packages only on Linux: on Windows `--with-deps`
      # spends 3.5 minutes adding the Media Foundation feature, which no spec uses (17 §4.1).
      - run: pnpm exec playwright install --only-shell chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: pnpm build
      # J9 runs in the walkthrough job below.
      - name: pnpm e2e (all but J9)
        id: e2e
        # bash: PowerShell, the default on Windows, reads `@walkthrough` as splatting and drops it.
        shell: bash
        run: pnpm e2e --grep-invert @walkthrough --shard=${{ matrix.shard }}/2
      - name: Upload E2E traces
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ runner.os }}-${{ matrix.shard }}
          path: test-results/

  walkthrough:
    name: e2e J9 (${{ matrix.os }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # One theme per shard.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --only-shell chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: pnpm build
      - name: pnpm e2e (J9)
        id: e2e
        shell: bash
        run: pnpm e2e --grep @walkthrough --shard=${{ matrix.shard }}/4
      - name: Upload E2E traces
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-results-${{ runner.os }}-${{ matrix.shard }}
          path: test-results/

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Allow Chromium's sandbox for Electron (Ubuntu 24.04 restricts unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      - name: Electron launch smoke
        if: runner.os != 'Linux'
        run: pnpm e2e:smoke
      - name: Electron launch smoke (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e:smoke
      - name: Package (NSIS / AppImage + deb)
        if: ${{ !cancelled() }}
        run: pnpm dist
      - name: Upload installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  macos:
    name: verify (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --only-shell chromium
      - name: pnpm check
        if: ${{ !cancelled() }}
        run: pnpm check
      - name: pnpm test
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: test:int (without the database tests, see the int job)
        if: ${{ !cancelled() }}
        run: pnpm test:int $(git ls-files '*.int.test.ts' | grep -v '/databases\..*int.test.ts$')
      - name: pnpm build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: pnpm e2e
        id: e2e
        if: ${{ !cancelled() }}
        run: pnpm e2e
      # Before the Electron smoke: Playwright empties test-results/ at the start of every run.
      - name: Upload E2E traces
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-macOS
          path: test-results/
      - name: Electron launch smoke
        if: ${{ !cancelled() }}
        run: pnpm e2e:smoke
