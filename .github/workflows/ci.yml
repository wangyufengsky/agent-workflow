# Three-platform CI (docs/17 §4.1, D71). Tests that need the real opencode and a model (test:oc, test:live, J10) are
# not run here: they stay on the developer's machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Allow Chromium's sandbox for Electron (Ubuntu 24.04 restricts unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `pnpm verify` step by step, so the integration tests can leave out the MySQL tests where they cannot run.
      - run: pnpm check
      - run: pnpm test
      - name: test:int
        if: runner.os == 'Linux'
        run: |
          docker pull mysql:8.4
          pnpm test:int
      # databases.int.test.ts needs the Linux container mysql:8.4: the Windows runner's Docker runs only Windows
      # containers and the macOS runner has no Docker. It only talks to MySQL over TCP, so the ubuntu run covers it.
      - name: test:int (without the MySQL tests, see above)
        if: runner.os != 'Linux'
        run: pnpm test:int --exclude '**/databases.int.test.ts'
      - run: pnpm build

      - run: pnpm e2e
      - name: Electron launch smoke
        if: runner.os != 'Linux'
        run: pnpm e2e:smoke
      - name: Electron launch smoke (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e:smoke

      - name: Package (NSIS / AppImage + deb)
        if: runner.os != 'macOS'
        run: pnpm dist
      - name: Upload installers
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
