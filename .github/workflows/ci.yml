# CI on Windows x64, Linux x64/arm64 and macOS (docs/17 §4.1, D228). Runs only when started by hand (Actions →
# CI → Run workflow, or `gh workflow run ci.yml --ref <branch>`): before a release, or when a change needs checking on
# Windows or Linux.
# Day-to-day acceptance is the full local run on macOS. Tests that need the real opencode and a model (test:oc,
# test:live, J10) are not run here: they stay on the developer's machine.
#
# Every platform runs the same tests as `pnpm verify`, `pnpm e2e` and `pnpm e2e:smoke`. On the two Linux runners the
# suites are split into jobs that run at once (int and browser E2E in shards). macOS stays one job: it finishes in
# about 3 minutes.
#
# Inside a job, later steps run after a failed one, so a round shows every problem of that job; a failed step fails
# its job and with it the run. A failed job is rerun on its own with "Re-run failed jobs".
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pnpm check
        run: pnpm check
      - name: pnpm test
        if: ${{ !cancelled() }}
        run: pnpm test

  int:
    name: test:int (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The browser module's tests drive a real Chromium (headless shell, docs/07 §4 createChromiumHost).
      - run: pnpm exec playwright install --only-shell chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      # The database tests run on both architectures. SQL Server and openGauss publish x64 images only: on arm64 they
      # are not pulled and their cases skip (test/helpers/db-containers.ts); x64 covers them (docs/24 §7).
      - name: test:int
        if: runner.os == 'Linux'
        run: |
          docker pull mysql:8.4
          docker pull postgres:17.6
          if [ "${{ runner.arch }}" = X64 ]; then
            docker pull opengauss/opengauss-server:7.0.0-RC3.B025
            docker pull mcr.microsoft.com/mssql/server:2022-latest
          fi
          pnpm test:int --shard=${{ matrix.shard }}/2
      # Windows runner 只能运行 Windows 容器；数据库测试由两种 Linux 架构覆盖。
      - name: test:int (without the database tests)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm test:int --shard=${{ matrix.shard }}/2 $(git ls-files '*.int.test.ts' | grep -v '/databases\..*int.test.ts$')

  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Only the headless shell: browser E2E runs headless.
      - run: pnpm exec playwright install --only-shell chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: pnpm build
      # J21 browses a real PostgreSQL; without the image it skips (docs/07 §5).
      - run: docker pull postgres:17.6
        if: runner.os == 'Linux'
      # J9 runs in the walkthrough job below.
      - name: pnpm e2e (all but J9)
        id: e2e
        shell: bash
        run: pnpm e2e --grep-invert @walkthrough --shard=${{ matrix.shard }}/2
      - name: Upload E2E traces
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/

  walkthrough:
    name: e2e J9 (${{ matrix.os }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
        # One theme per shard.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --only-shell chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: pnpm build
      - name: pnpm e2e (J9)
        id: e2e
        shell: bash
        run: pnpm e2e --grep @walkthrough --shard=${{ matrix.shard }}/4
      - name: Upload E2E traces
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-results-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Allow Chromium's sandbox for Electron (Ubuntu 24.04 restricts unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      - name: Electron launch smoke (virtual display)
        id: smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e:smoke
      - name: Electron launch smoke (Windows)
        id: windows-smoke
        if: runner.os == 'Windows'
        run: pnpm e2e:smoke
      # The smoke above has no Secret Service (the master password path); here gnome-keyring runs, unlocked, on a
      # session bus, and xvfb still gives no desktop environment: Chromium alone would pick its hard-coded key (D167).
      - name: Electron credential store with a Secret Service (virtual display)
        id: secret-service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring dbus
          xvfb-run -a dbus-run-session -- sh -c 'printf aw-ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && AW_E2E_SECRET_SERVICE=1 pnpm exec playwright test credentials.electron --project electron'
      - name: Upload smoke traces
        if: ${{ !cancelled() && (steps.smoke.outcome == 'failure' || steps.windows-smoke.outcome == 'failure' || steps.secret-service.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.os }}
          path: test-results/
      # Each runner packages its own architecture, the one the smoke above ran on (electron-builder.yml names no arch).
      - name: Package (NSIS / AppImage + deb)
        if: ${{ !cancelled() }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm dist
      - name: Install unsigned NSIS and smoke the installed application
        id: installed-smoke
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $installer = Get-Item apps/desktop/release/*-setup-x64.exe
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'NotSigned') { throw 'Expected an unsigned installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Agent Workflow 安装测试'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          & "$installDir/resources/ripgrep/rg.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ripgrep did not run' }
          $env:AW_E2E_EXECUTABLE_PATH = Join-Path $installDir 'Agent Workflow.exe'
          pnpm exec playwright test launch.electron --project electron
      - name: Upload installed application smoke traces
        if: ${{ !cancelled() && steps.installed-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: installed-smoke-results-${{ matrix.os }}
          path: test-results/
      - name: Upload installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*-setup-x64.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  macos:
    name: verify (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --only-shell chromium
      - name: pnpm check
        if: ${{ !cancelled() }}
        run: pnpm check
      - name: pnpm test
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: test:int (without the database tests, see the int job)
        if: ${{ !cancelled() }}
        run: pnpm test:int $(git ls-files '*.int.test.ts' | grep -v '/databases\..*int.test.ts$')
      - name: pnpm build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: pnpm e2e
        id: e2e
        if: ${{ !cancelled() }}
        run: pnpm e2e
      # Before the Electron smoke: Playwright empties test-results/ at the start of every run.
      - name: Upload E2E traces
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-macOS
          path: test-results/
      - name: Electron launch smoke
        if: ${{ !cancelled() }}
        run: pnpm e2e:smoke
