name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.5.7
        required: true
        type: string
      ci_run_id:
        description: Successful CI run ID for the tagged commit
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        default: false
        type: boolean

concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  draft:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and stage release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TMPDIR: ${{ runner.temp }}
          RELEASE_TAG: ${{ inputs.tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: node scripts/prepare-release.mjs "$RELEASE_TAG" "$CI_RUN_ID"
