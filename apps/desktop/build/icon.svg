<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Agent Workflow</title>
  <!-- App icon (D190): the workflow rising, three linked nodes in the companion's aurora colours, on the macOS icon grid (824 px body). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161a2b"/><stop offset="1" stop-color="#090b12"/></linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3ee0e8"/><stop offset=".5" stop-color="#6d8bff"/><stop offset="1" stop-color="#b37dff"/></linearGradient>
    <radialGradient id="glow" cx=".72" cy=".3" r=".6"><stop offset="0" stop-color="#8a72ff" stop-opacity=".38"/><stop offset="1" stop-color="#8a72ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <path d="M300 690 L512 560 L724 360" fill="none" stroke="url(#aurora)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <circle cx="724" cy="360" r="100" fill="#9d84ff" opacity=".6" filter="url(#halo)"/>
  <circle cx="300" cy="690" r="62" fill="#121524" stroke="#3ee0e8" stroke-width="30"/>
  <circle cx="512" cy="560" r="62" fill="#121524" stroke="#6d8bff" stroke-width="30"/>
  <circle cx="724" cy="360" r="84" fill="url(#aurora)"/>
</svg>
