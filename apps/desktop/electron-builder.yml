# Everything the app needs is bundled into out/ by electron-vite, so no node_modules are packaged.
appId: com.wangyufengsky.agent-workflow
productName: Agent Workflow
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # Built by `pnpm build:plugin` (M2-03).
  - from: ../../packages/opencode-plugin/dist
    to: opencode-plugin
  - from: ../../packages/server/migrations
    to: migrations
  - from: ../../packages/builtin/prompts
    to: prompts
npmRebuild: false
asar: true
mac:
  # Rendered from build/icon.svg (1024 px) and packed with iconutil.
  icon: build/icon.icns
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.developer-tools
  # Unsigned until a Developer ID certificate is available (M6-04).
  identity: null
# Windows and Linux (v1.1, 17 §3.8, D76): x64 only, unsigned. Artifact names without spaces.
win:
  # electron-builder converts the 1024 px PNG (extracted from icon.icns) to .ico.
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: agent-workflow-${version}-setup-${arch}.${ext}
linux:
  icon: build/icon.png
  executableName: agent-workflow
  category: Development
  maintainer: wangyufeng (https://github.com/wangyufengsky/agent-workflow)
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
appImage:
  artifactName: agent-workflow-${version}-${arch}.${ext}
deb:
  packageName: agent-workflow
  artifactName: agent-workflow_${version}_${arch}.${ext}
