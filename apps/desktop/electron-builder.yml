# Everything the app needs is bundled into out/ by electron-vite, so no node_modules are packaged.
appId: com.wangyufengsky.agent-workflow
productName: Agent Workflow
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.png
extraResources:
  # Built by `pnpm build:plugin` (M2-03).
  - from: ../../packages/opencode-plugin/dist
    to: opencode-plugin
  - from: ../../packages/server/migrations
    to: migrations
  - from: ../../packages/builtin/prompts
    to: prompts
  - from: ../../packages/builtin/skills
    to: skills
  # Fetched by scripts/fetch-ripgrep.mjs; added to opencode's PATH (D213).
  - from: build/ripgrep/${os}-${arch}
    to: ripgrep
npmRebuild: false
asar: true
mac:
  # Rendered from build/icon.svg (1024 px) and packed with iconutil.
  icon: build/icon.icns
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.developer-tools
  # Unsigned until a Developer ID certificate is available (M6-04).
  identity: null
# Windows and Linux (v1.1, 17 §3.8, D76): Windows x64, Linux x64 and arm64 (D160), unsigned. Artifact names without spaces.
win:
  # electron-builder converts the 1024 px PNG (extracted from icon.icns) to .ico.
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: agent-workflow-${version}-setup-${arch}.${ext}
linux:
  icon: build/icon.png
  executableName: agent-workflow
  category: Development
  maintainer: wangyufeng (https://github.com/wangyufengsky/agent-workflow)
  # x64 and arm64 (D160). No arch here: `pnpm dist` builds the machine's own architecture (an arch listed here would
  # win over the command line), `pnpm dist --x64 --arm64` builds both; no native modules are packaged, so either
  # builds anywhere. CI packages each on its own runner, where the Electron smoke ran.
  target:
    - AppImage
    - deb
appImage:
  artifactName: agent-workflow-${version}-${arch}.${ext}
deb:
  packageName: agent-workflow
  artifactName: agent-workflow_${version}_${arch}.${ext}
