<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>功能测试现场 · Agent Workflow</title>
<style>
:root { color-scheme: dark; --bg:#131519; --panel:#1a1d22; --line:#353a43; --sub:#a5aeba; --ink:#eef1f5; --mint:#95debd; --blue:#a9c3ff; --red:#ffb7a9 }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 Inter,system-ui,sans-serif }
header,main { max-width:1100px; margin:auto; padding:20px clamp(18px,4vw,48px) }
header { display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--line) }
header small { margin-left:auto }
h1 { margin:5px 0; font-size:clamp(25px,4vw,38px); letter-spacing:-.04em }
h2 { margin:0 0 14px; font-size:16px }
small,.muted,.meta { color:var(--sub) }
code,pre,.id,time { font-family:"IBM Plex Mono",ui-monospace,monospace }
.toolbar,.bar { display:flex; align-items:center; flex-wrap:wrap; gap:10px }
.toolbar { justify-content:space-between; margin:22px 0 12px }
button { color:var(--ink); background:#242932; border:1px solid #414955; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer }
button:focus-visible,.reel:focus-visible { outline:2px solid var(--blue); outline-offset:-2px }
button:disabled { cursor:default; opacity:.45 }
#mode { color:var(--mint) }
.work { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.grid { display:grid; grid-template-columns:minmax(225px,.8fr) minmax(0,1.25fr) }
section { min-width:0; padding:20px }
.deck { border-right:1px solid var(--line) }
.reel { height:192px; overflow:auto; padding-block:64px; scroll-snap-type:y mandatory; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#505969 transparent }
.case { display:grid; width:100%; height:64px; align-content:center; text-align:left; scroll-snap-align:center; padding:0 11px; background:none; color:var(--sub); border:0; border-radius:4px }
.case[aria-pressed="true"] { color:var(--ink); background:#26303c; box-shadow:inset 3px 0 var(--blue) }
.case[aria-pressed="true"] strong { font-size:17px }
.case small { font-size:11px }
ol { padding-left:22px; margin:0 }
li { padding:7px 0; overflow-wrap:anywhere }
.terminal { background:#101318; border-top:1px solid var(--line) }
pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; min-height:115px; max-height:235px; overflow:auto; color:#d7e2ef; line-height:1.8 }
.bad { color:var(--red) }
#fixArea { margin-top:12px }
footer { color:var(--sub); margin:14px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
footer strong { margin-right:auto; font-weight:500 }
@media(max-width:680px) { .grid { grid-template-columns:1fr } .deck { border-right:0; border-bottom:1px solid var(--line) } section { padding:14px } }

[hidden]{display:none!important}
nav{display:flex;gap:5px;flex-wrap:wrap;margin:22px 0 14px}
nav button{background:transparent;border-color:transparent}
nav button[aria-current="step"],.drafts button[aria-pressed="true"]{background:#283344;color:#dce9ff;border-color:#485d76}
.workspace{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(220px,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.work{border:0;border-radius:0}
aside{min-width:0;padding:18px;background:#17191d;border-left:1px solid var(--line)}
aside h2{margin:0 0 8px}
details{margin:7px 0}summary{cursor:pointer;overflow-wrap:anywhere}details p{color:var(--sub);overflow-wrap:anywhere;margin:5px 0}
.drafting{display:grid;grid-template-columns:minmax(130px,.65fr) minmax(0,1.6fr)}
.drafts{border-right:1px solid var(--line);padding:15px}
.drafts button{display:block;width:100%;text-align:left;margin:6px 0}
article{padding:24px;min-width:0}article h3{margin:16px 0 4px}article p{margin:5px 0}
.paper{background:#f3f0e8;color:#282d30;line-height:1.8;margin:16px;border-radius:3px}
.paper h2{font:600 22px/1.45 Georgia,serif}.paper table{width:100%;border-collapse:collapse}.paper td,.paper th{border-bottom:1px solid #ccc8bc;text-align:left;padding:5px}
dialog{max-width:min(640px,92vw);width:100%;max-height:75vh;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:22px}dialog::backdrop{background:#0009}
@media(max-width:820px){.workspace{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:580px){.drafting{grid-template-columns:1fr}.drafts{border:0}.drafts button{display:inline-block;width:auto;margin:3px}.paper{margin:8px} article{padding:16px}}
</style>
</head>
<body>
<header><strong>Agent Workflow</strong><span class="muted">/ 任务现场</span><small>交互原型 · 模拟数据</small></header>
<main>
<div class="meta">功能测试 · todo-web</div>
<h1>待办事项的创建与完成</h1>
<label>演示来源 <select id="source"><option value="written">AI 编写案例</option><option value="import">解析上传案例（示例文件）</option></select></label>
<nav id="phases" aria-label="演示阶段"></nav>
<div class="workspace"><div>
<div id="drafting" class="drafting" hidden><div class="drafts"><h2>案例名</h2><div id="names"></div></div><article id="caseBody"></article></div>
<section id="setup" hidden><h2>准备环境</h2><div id="setupActions"></div></section>
<div id="report" hidden><article class="paper" id="paper"></article></div>
<div id="execution"><div class="toolbar"><span id="progress"></span><div class="bar"><small id="mode"></small><button id="live">回到实时</button></div></div>
<div class="work"><div class="grid">
<section class="deck"><h2>测试用例</h2><div class="reel" id="reel" tabindex="0" aria-label="测试用例，使用上下方向键切换"></div></section>
<section><h2 id="actionTitle">AI 测试行为</h2><div id="actions"></div></section></div>
<section class="terminal"><h2 id="termTitle">结果终端</h2><pre id="terminal" tabindex="0"></pre><div id="fixArea"><button id="fix"></button><p id="ticket" hidden></p></div></section></div>
</div></div><aside id="activitySide"><h2>AI 活动</h2><details id="activityGroup" open><summary id="activityLabel"></summary><div id="activityRows"></div></details><button id="openDetail">完整详情</button></aside></div>
<dialog id="detailsDialog" aria-labelledby="detailTitle"><h2 id="detailTitle"></h2><div id="detailBody"></div><form method="dialog"><button>关闭</button></form></dialog>
<footer><strong>示例回放</strong><button id="play">暂停回放</button><button id="next">下一事件</button><button id="reset">重新播放</button></footer>
</main>
<script>
const cases = [
  {name:'创建待办事项', expect:'返回新事项的 ID 与初始状态', steps:[
    ['POST /api/todos','HTTP     → POST /api/todos'],
    ['收到创建响应','HTTP     ← 201 · 28 ms · {"id":42,"done":false}'],
    ['核对初始状态','PASS     预期 done=false，实际 false']]},
  {name:'完成后刷新保留状态', expect:'刷新后同一事项仍为已完成', failed:true, steps:[
    ['点击「完成」','BROWSER  点击事项 42 的「完成」'],
    ['PATCH /api/todos/42','HTTP     → PATCH /api/todos/42  {"done":true}'],
    ['收到更新响应','HTTP     ← 200 · 16 ms · {"done":true}'],
    ['刷新并读取事项 42','BROWSER  刷新后，事项 42 显示「未完成」'],
    ['核对刷新后的状态','FAIL     预期「已完成」，实际「未完成」']]},
  {name:'拒绝无效状态', expect:'返回 invalid_state，原状态保持', steps:[
    ['v1 · 发送非法状态','HTTP     → PATCH /api/todos/43  {"state":"abc"}'],
    ['v1 · 核对错误类型','BLOCKED  返回 422 unknown_field；断言预期 invalid_state。未触达状态校验。'],
    ['修订 v1 → v2','REVISE   测试工程师 AI · 字段 state → done。示例接口契约 todo-v1「更新事项」规定写入 done；旧字段触发了未知字段校验。保留 invalid_state 和原状态两条断言。'],
    ['v2 · 准备独立事项并复测','HTTP     → PATCH /api/todos/53  {"done":"abc"}'],
    ['收到校验错误','HTTP     ← 422 · 19 ms · invalid_state'],
    ['GET /api/todos/53','HTTP     → GET /api/todos/53'],
    ['核对数据未变','PASS     HTTP 200 · 预期 done=false，实际 false']]},
  {name:'删除后从列表消失', expect:'重新读取列表后找不到该事项', steps:[
    ['DELETE /api/todos/44','HTTP     → DELETE /api/todos/44'],
    ['收到删除响应','HTTP     ← 204 · 13 ms'],
    ['读取列表并核对','PASS     GET /api/todos · 列表内无事项 44']]}
];
const el = id => document.getElementById(id);
const reel = el('reel');
const events = cases.flatMap((item,index) => item.steps.map((step,position) => ({index,position,step})));
const id = i => 'FT-' + String(i+1).padStart(2,'0');
let frame=0, selected=0, review=false, playing=true, finished=false, showTicket=false, linked=false;
let returnTimer, timer, pointerDown=false;
const position = () => reel.children[selected].offsetTop - reel.children[0].offsetTop;
function center(animate) {
  reel.scrollTo({top:position(),behavior:animate && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'instant'});
}
function follow(animate=true) {
  clearTimeout(returnTimer); review=false; selected=events[frame].index; showTicket=false; center(animate); render();
}
function armReturn() {
  clearTimeout(returnTimer);
  if (phase==='execution' && review && !finished && !pointerDown && !window.getSelection()?.toString()) returnTimer=setTimeout(follow,5000);
}
function inspect(index) {
  if (index!==selected) showTicket=false;
  selected=index; review=true; armReturn(); render();
}
function render() {
  const records=events.slice(0,frame+1);
  const current=events[frame].index;
  const status = i => {
    const count=records.filter(e=>e.index===i).length;
    if (count===cases[i].steps.length) return cases[i].failed ? '失败' : '通过';
    return count ? '执行中' : '待执行';
  };
  el('progress').textContent=finished ? '本轮已完成 · 3 通过 / 1 失败' : '运行位置 · '+id(current)+' '+cases[current].name;
  el('mode').textContent=finished ? '查看本轮记录' : review ? '回看中 · 空闲 5 秒回到实时' : '正在跟随';
  el('live').disabled=finished || !review;
  Array.from(reel.children).forEach((row,i)=>{
    row.setAttribute('aria-pressed',String(i===selected));
    row.firstChild.textContent=id(i)+' · '+status(i);
  });
  const seen=records.filter(e=>e.index===selected);
  el('actionTitle').textContent='AI 测试行为 · '+id(selected);
  const list=document.createElement('ol');
  for (const event of seen) {
    const item=document.createElement('li'); item.textContent=event.step[0]; list.append(item);
  }
  el('actions').replaceChildren(seen.length ? list : document.createTextNode('待执行 · '+cases[selected].expect));
  el('termTitle').textContent='结果终端 · '+id(selected);
  const log=el('terminal');
  log.textContent=seen.map(e=>'10:24:'+String(events.indexOf(e)*2).padStart(2,'0')+'  '+e.step[1]).join('\n') || '等待用例开始';
  log.classList.toggle('bad',status(selected)==='失败');
  el('fixArea').hidden=status(selected)!=='失败';
  el('fix').textContent=linked ? '查看示例修复任务' : '建立示例修复任务';
  el('ticket').hidden=!showTicket;
  el('ticket').textContent='FIX-01 · 刷新后完成状态丢失　来源 FT-02 / 第 1 轮。复现：点击完成后刷新。验收：事项 42 刷新后仍为已完成。';
  el('play').disabled=phase==='report'; el('next').disabled=phase==='report';
  el('play').textContent=playing ? '暂停回放' : '继续回放';
}
function advance() {
  if (phase==='drafting') {
    if (draftCount<cases.length) {draftCount++; if (followDraft) draftChoice=draftCount-1; drawPhase()}
    else enter('setup');
    return;
  }
  if (phase==='setup') {
    if (setupCount<setupSteps.length) {setupCount++; drawPhase()} else enter('execution');
    return;
  }
  if (phase==='report') return;
  if (finished) { enter('report'); return; }
  frame=Math.min(frame+1,events.length-1);
  finished=frame===events.length-1;
  if (finished) clearTimeout(returnTimer);
  if (!review && selected!==events[frame].index) follow(); else render();
  drawActivity();
}
function schedule() {
  clearInterval(timer); if (playing) timer=setInterval(advance,2000);
}
cases.forEach((item,i)=>{
  const row=document.createElement('button'); row.className='case'; row.tabIndex=-1;
  row.append(document.createElement('small'),document.createElement('strong'));
  row.lastChild.textContent=item.name;
  row.onclick=()=>{inspect(i);center(false)};
  reel.append(row);
});
reel.addEventListener('wheel',()=>inspect(selected),{passive:true});
reel.addEventListener('pointerdown',()=>{pointerDown=true;inspect(selected)});
window.addEventListener('pointerup',()=>{pointerDown=false;armReturn()});
reel.addEventListener('scroll',()=>{
  if (review) inspect(Math.max(0,Math.min(cases.length-1,Math.round(reel.scrollTop/reel.firstChild.clientHeight))));
});
reel.onkeydown=e=>{
  if (!['ArrowDown','ArrowUp','Home','End'].includes(e.key)) return;
  e.preventDefault();
  const dest=e.key==='Home'?0:e.key==='End'?cases.length-1:selected+(e.key==='ArrowDown'?1:-1);
  inspect(Math.max(0,Math.min(cases.length-1,dest)));center(false);
};
el('terminal').addEventListener('wheel',armReturn,{passive:true});
el('terminal').addEventListener('pointerdown',()=>{pointerDown=true;clearTimeout(returnTimer)});
document.addEventListener('selectionchange',armReturn);
el('live').onclick=()=>follow();
el('next').onclick=advance;
el('play').onclick=()=>{playing=!playing;schedule();render()};
el('reset').onclick=()=>{
  playing=true;linked=false;showTicket=false;enter('drafting');schedule();
};
el('fix').onclick=()=>{linked=true;showTicket=true;armReturn();render()};

const phases={drafting:'编写案例',setup:'准备环境',execution:'执行测试',report:'测试报告'};
const sources=[
  ['创建待办.md','第 4–8 行','TD-01','提交新待办，核对返回 ID，初始状态应为未完成。'],
  ['待办验收.docx','章节「状态持久化」· 表 1 第 2 行','TD-02','点击完成，刷新页面，同一条事项应保持已完成。'],
  ['接口案例.txt','第 11–15 行','TD-03','提交非法状态，预期 invalid_state，原状态保持。'],
  ['待办回归.xlsx','工作表「待办」· B12:F14','TD-04','删除指定事项。重新查询列表，同一 ID 应已移除。']
];
const importing=()=>el('source').value==='import';
const sourcePosition=i=>sources[i].slice(0,3).join(' · ');
const setupSteps=[
  ['读取项目启动配置','读取 package.json，确认测试服务启动命令与入口。'],
  ['启动本地服务','启动项目测试服务，采集该进程的标准输出与错误输出。'],
  ['核验服务与测试数据','GET /health → 200，测试数据已就绪。']
];
const plans=[
  ['测试库可写，准备一条新标题。','提交创建请求，再按返回的 ID 查询记录。'],
  ['当前用户有一条未完成的事项。','点击「完成」，刷新页面，按同一 ID 找回事项并读取状态。'],
  ['准备一条已知状态的事项。','提交非法状态，再查询原事项的状态。'],
  ['准备一条可删除的测试事项。','删除事项，重新获取列表，查找同一 ID。']
];
let phase='drafting',draftCount=1,draftChoice=0,followDraft=true,setupCount=1;
function element(tag,value) {
  const node=document.createElement(tag); node.textContent=value; return node;
}
function rows(container,items) {
  const existing=[...container.children];
  items.forEach(([label,detail],i)=>{
    if (existing[i]?.firstChild.textContent===label && existing[i]?.lastChild.textContent===detail) return;
    const row=document.createElement('details');
    row.append(element('summary',label),element('p',detail));
    if (existing[i]) existing[i].replaceWith(row); else container.append(row);
  });
  existing.slice(items.length).forEach(node=>node.remove());
}
function currentActivity() {
  if (phase==='drafting') return cases.slice(0,draftCount).map((c,i)=>importing()
    ? ['解析 '+id(i)+' · '+c.name,sourcePosition(i)]
    : ['编写 '+id(i)+' · '+c.name,c.expect]);
  if (phase==='setup') return setupSteps.slice(0,setupCount);
  if (phase==='report') return [['汇总本轮断言','已对照 4 条用例的执行记录。'],['写入测试报告','记录 3 项通过、1 项失败及失败步骤。']];
  return events.slice(0,frame+1).map(e=>[id(e.index)+' · '+e.step[0],e.step[1]]);
}
function drawActivity() {
  el('activityLabel').textContent=phases[phase]+' · '+phaseRole();
  rows(el('activityRows'),currentActivity());
}
function phaseRole() {
  return phase==='report' || (phase==='drafting' && importing()) ? '文档处理员' : '测试工程师';
}
function openDetails() {
  el('detailTitle').textContent=phases[phase]+' · '+phaseRole()+' · 完整详情';
  el('detailBody').replaceChildren(...currentActivity().map(([label,detail])=>{
    const record=document.createElement('div');record.append(element('h3',label),element('p',detail));return record;
  }));
  el('detailsDialog').showModal();
}
el('openDetail').onclick=openDetails;
function drawDraft() {
  const list=el('names');
  for(let i=list.children.length;i<draftCount;i++){
    const button=element('button',id(i)+' '+cases[i].name);
    button.onclick=()=>{followDraft=false;draftChoice=i;drawDraft()};
    list.append(button);
  }
  [...list.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===draftChoice)));
  const c=cases[draftChoice], body=el('caseBody');
  const selection=id(draftChoice)+'/'+followDraft+'/'+importing();
  if(body.dataset.selection===selection) return;
  body.dataset.selection=selection;
  body.replaceChildren(element('small',id(draftChoice)),element('h2',c.name),
    element('h3','前置条件'),element('p',plans[draftChoice][0]),
    element('h3','操作步骤'),element('p',plans[draftChoice][1]),element('h3','预期结果'),element('p',c.expect));
  if(importing()){
    const excerpt=document.createElement('details');
    excerpt.append(element('summary','对照原文'),element('p',sources[draftChoice][3]));
    body.append(element('h3','案例来源'),element('p',sourcePosition(draftChoice)),excerpt);
  }
  if(!followDraft){
    const back=element('button',importing()?'跟随解析':'跟随编写');back.onclick=()=>{followDraft=true;draftChoice=draftCount-1;drawDraft()};body.append(back);
  }
}
function drawReport(){
  const paper=el('paper'), table=document.createElement('table');
  const head=table.createTHead().insertRow();
  ['用例','判定'].forEach(label=>head.append(element('th',label)));
  for(const [i,c] of cases.entries()){
    const row=table.insertRow();row.insertCell().textContent=id(i)+' '+c.name;row.insertCell().textContent=i===2?'通过（v2 复测）':c.failed?'失败':'通过';
  }
  const fix=element('button',linked?'查看示例修复任务':'建立示例修复任务');
  fix.onclick=()=>{linked=true;drawReport()};
  paper.replaceChildren(element('small','todo-web · 第 1 轮 · 本地测试环境'),element('h2','待办事项功能测试报告'),
    element('h3','测试结论'),element('p','执行 4 条用例，3 项通过，1 项失败。完成状态在刷新后丢失。'),
    element('h3','逐项结果'),table,element('h3','FT-02 复现与证据'),
    element('p','点击完成后，PATCH /api/todos/42 返回 200，响应字段 done 为 true。刷新页面，事项 42 显示「未完成」，预期为「已完成」。'),fix);
  if(linked) paper.append(element('p','已关联 FIX-01 · 刷新后完成状态丢失'));
  paper.append(element('h3','用例修订 · 1 条'));
  const history=document.createElement('details');
  history.append(element('summary','FT-03 · 查看 v1、修改原因与 v2 结果'));
  for(const event of events.filter(item=>item.index===2)){
    const time='10:24:'+String(events.indexOf(event)*2).padStart(2,'0');
    history.append(element('p',time+'　'+event.step[1]));
  }
  paper.append(history);
  if(importing()){
    const origins=document.createElement('details');origins.append(element('summary','查看上传案例来源'));
    sources.forEach((_,i)=>origins.append(element('p',id(i)+' · '+sourcePosition(i))));
    paper.append(origins);
  }
}
function drawPhase(){
  for(const name of Object.keys(phases)) el(name).hidden=name!==phase;
  for(const button of el('phases').children) {
    if(button.dataset.phase===phase) button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');
  }
  el('activitySide').hidden=phase==='setup';
  el('execution').parentElement.parentElement.style.gridTemplateColumns=phase==='setup'?'1fr':'';
  if(phase==='drafting') drawDraft();
  if(phase==='setup'){
    rows(el('setupActions'),setupSteps.slice(0,setupCount));
    if (!el('setupDetail')) {
      const button=element('button','完整详情');button.id='setupDetail';button.onclick=openDetails;el('setup').append(button);
    }
  }
  if(phase==='report') drawReport();
  drawActivity();render();
}
function enter(name){
  clearTimeout(returnTimer); review=false; phase=name;
  if(name==='drafting') {draftCount=1;draftChoice=0;followDraft=true;el('names').replaceChildren()}
  if(name==='setup') setupCount=1;
  if(name==='execution') {frame=0;finished=false;selected=0;showTicket=false}
  if(name==='report') {playing=false;clearInterval(timer)}
  el('activityRows').replaceChildren();el('activityGroup').open=true;
  drawPhase();if(name==='execution') center(false);
}
for(const [key,label] of Object.entries(phases)){
  const button=element('button',label);button.dataset.phase=key;button.onclick=()=>enter(key);el('phases').append(button);
}
el('source').onchange=()=>{
  phases.drafting=importing()?'解析上传案例':'编写案例';
  el('phases').firstElementChild.textContent=phases.drafting;
  linked=false;enter('drafting');schedule();
};
enter('drafting');schedule();
</script>
</body></html>
